# rerun-marker: 2026-10-05 individual-level Dryad generality check
# external-source-fail-soft-v1
name: Godwit external generality

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/godwit-generality.yml"
      - "analysis/06_fetch_godwit_generality_data.py"
      - "analysis/07_godwit_seasonal_state_displacement.py"

permissions:
  contents: read

jobs:
  godwit-generality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public Dryad data and audit availability
        id: fetch
        run: |
          python analysis/06_fetch_godwit_generality_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/external/godwit_senegal/dryad_metadata_audit.json")
          x=json.load(open(p))
          ready=bool(x.get("primary_csv_ready"))
          print("Dryad status:", x.get("status"))
          print("API error:", x.get("api_error"))
          print("Download errors:", x.get("download_errors", []))
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Inspect fetched CSVs
        if: steps.fetch.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path("data/external/godwit_senegal")
          for name in ("location_data.csv","habitat_use_df.csv"):
              p=root/name
              with p.open("r",encoding="utf-8-sig",newline="") as f:
                  r=csv.reader(f)
                  print(name, p.stat().st_size, next(r))
          PY

      - name: Run frozen generality analysis
        if: steps.fetch.outputs.ready == 'true'
        run: |
          python analysis/07_godwit_seasonal_state_displacement.py
          cat analysis/results/godwit_seasonal_state_displacement.json

      - name: Record external-source skip
        if: steps.fetch.outputs.ready != 'true'
        run: |
          echo "Godwit generality analysis skipped: Dryad primary CSVs unavailable from runner."
          echo "This optional external-source check is not part of the Lake Erie primary evidence."

      - name: Upload availability/result audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godwit-generality-audit
          path: |
            analysis/results/godwit_seasonal_state_displacement.json
            data/external/godwit_senegal/dryad_metadata_audit.json
          if-no-files-found: warn
          retention-days: 30
