name: California four-species temporal state fidelity

on:
  push:
    paths:
      - "analysis/contracts/california_temporal_state_fidelity_v2.json"
      - "analysis/61_california_used_state_preflight_v2.py"
      - "analysis/62_california_temporal_state_fidelity_v2.py"
      - "analysis/63_california_individual_year_identity_audit.py"
      - "analysis/tests/test_california_temporal_state_fidelity_v2.py"
      - ".github/workflows/california-temporal-state-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Validate source and synthetic ecology tests
        run: |
          python -m py_compile analysis/61_california_used_state_preflight_v2.py analysis/62_california_temporal_state_fidelity_v2.py
          python analysis/tests/test_california_used_state_preflight_v2.py
          python analysis/tests/test_california_temporal_state_fidelity_v2.py
      - name: Reproduce locked source-linked four-species state-fidelity result
        run: |
          cp analysis/results/california_temporal_state_fidelity_v2.json /tmp/california_frozen_result.json
          python analysis/62_california_temporal_state_fidelity_v2.py
          python - <<'PY'
          import json, math
          a=json.load(open('/tmp/california_frozen_result.json'))
          b=json.load(open('analysis/results/california_temporal_state_fidelity_v2.json'))
          def equal(x,y,path="root"):
              if type(x) is float or type(y) is float:
                  assert math.isclose(float(x),float(y),rel_tol=1e-12,abs_tol=1e-12), (path,x,y)
              elif isinstance(x,dict) and isinstance(y,dict):
                  assert x.keys()==y.keys(), (path,"keys")
                  for key in x: equal(x[key],y[key],path+"."+str(key))
              elif isinstance(x,list) and isinstance(y,list):
                  assert len(x)==len(y), (path,"length")
                  for i,(u,v) in enumerate(zip(x,y)): equal(u,v,path+"["+str(i)+"]")
              else:
                  assert x==y, (path,x,y)
          equal(a,b)
          print('PASS_CI_RESULT_NUMERIC_REPLAY_AT_1E_MINUS_12')
          PY
      - name: Audit source birdyear identity hierarchy without effect estimation
        run: python analysis/63_california_individual_year_identity_audit.py
      - name: Upload only aggregate ecological evidence (no animal location table)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louis-california-temporal-state-fidelity-v2
          retention-days: 90
          if-no-files-found: warn
          path: |
            analysis/results/california_temporal_state_fidelity_v2.json
            analysis/results/california_individual_year_identity_audit_v1.json
