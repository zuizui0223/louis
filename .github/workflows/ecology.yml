name: ecological decomposition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  king-rail-state-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Run detection versus latent-state decomposition
        run: python analysis/run_detection_state_decomposition.py
      - name: Show result
        run: cat results/king_rail_detection_state_decomposition.json
      - uses: actions/upload-artifact@v4
        with:
          name: king-rail-detection-state-result
          path: results/king_rail_detection_state_decomposition.json
