name: California endpoint-state source gate

on:
  push:
    paths:
      - "analysis/contracts/california_temporal_state_fidelity_v1.json"
      - "analysis/60_california_used_state_preflight.py"
      - "analysis/tests/test_california_used_state_preflight.py"
      - ".github/workflows/california-used-state-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source gate implementation
        run: |
          python -m py_compile analysis/60_california_used_state_preflight.py
          python analysis/tests/test_california_used_state_preflight.py
      - name: Verify pinned USGS CSV and exact-hour event pairing
        run: python analysis/60_california_used_state_preflight.py
      - name: Upload pre-effect pairing audit (no raw CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louis-california-source-preflight
          retention-days: 90
          if-no-files-found: warn
          path: analysis/results/california_used_state_preflight_v1.json
