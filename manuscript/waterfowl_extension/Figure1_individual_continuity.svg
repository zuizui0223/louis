<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="690" viewBox="0 0 1140 690" role="img" aria-label="Four California waterfowl species show positive excess hour-to-hour destination habitat category continuity beyond source-matched availability and fixed individual preference, with individual-ID cluster confidence intervals.">
