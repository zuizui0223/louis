<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:27px;font-weight:700}.panel{font-size:21px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.axis{stroke:#222;stroke-width:2}.thin{stroke:#555;stroke-width:1.4}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:6 6}.light{fill:#e6e6e6;stroke:#444;stroke-width:1.2}.dark{fill:#4f4f4f}.point{fill:#111}.open{fill:white;stroke:#111;stroke-width:2}
</style>
<text x="50" y="55" class="title" text-anchor="start">Figure 5. Ecological boundary: local buffering versus broader relocation</text>
<text x="50" y="105" class="small" text-anchor="start">Conceptual synthesis with independent South Carolina King Rail context</text>
<rect x="90" y="190" width="285" height="145" rx="15" class="light"/>
<text x="232" y="230" class="label" text-anchor="middle">Suitable hydrological state</text>
<text x="232" y="262" class="label" text-anchor="middle">remains locally available</text>
<text x="232" y="300" class="small" text-anchor="middle">Lake Erie: matched-event buffering</text>
<line x1="375" y1="262" x2="490" y2="262" class="axis"/><polygon points="490,262 480,255 480,269" fill="#222"/>
<rect x="500" y="190" width="285" height="145" rx="15" class="light"/>
<text x="642" y="230" class="label" text-anchor="middle">Within-home-range</text>
<text x="642" y="262" class="label" text-anchor="middle">hydrological buffering</text>
<text x="642" y="300" class="small" text-anchor="middle">experienced depth stays stable</text>
<line x1="785" y1="262" x2="900" y2="262" class="axis"/><polygon points="900,262 890,255 890,269" fill="#222"/>
<rect x="910" y="190" width="215" height="145" rx="15" class="light"/>
<text x="1017" y="230" class="label" text-anchor="middle">Local compensation</text>
<text x="1017" y="262" class="label" text-anchor="middle">fails</text>
<text x="1017" y="300" class="small" text-anchor="middle">broader relocation</text>

<text x="100" y="450" class="panel" text-anchor="start">South Carolina external context</text>
<text x="130" y="495" class="label" text-anchor="start">5/9 birds shifted seasonal home ranges</text>
<text x="130" y="530" class="label" text-anchor="start">mean shift 2.9 km  •  range 0.7–7.5 km</text>
<text x="130" y="565" class="label" text-anchor="start">flooding / vegetation management changed habitat availability</text>
<text x="130" y="620" class="small" text-anchor="start">Boundary: external context only — not a replication of Lake Erie SRI and not evidence that a measured Lake Erie displacement caused buffering.</text>
</svg>