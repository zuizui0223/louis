<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:27px;font-weight:700}.panel{font-size:21px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.axis{stroke:#222;stroke-width:2}.thin{stroke:#555;stroke-width:1.4}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:6 6}.light{fill:#e6e6e6;stroke:#444;stroke-width:1.2}.dark{fill:#4f4f4f}.point{fill:#111}.open{fill:white;stroke:#111;stroke-width:2}
</style>
<text x="50" y="55" class="title" text-anchor="start">Figure 1. Matched local availability turns habitat use into a temporal test</text>
<text x="50" y="110" class="panel" text-anchor="start">A</text><text x="90" y="110" class="panel" text-anchor="start">Repeated source design</text>
<circle cx="300" cy="260" r="42" class="dark"/>
<text x="300" y="267" class="label" text-anchor="middle">USED</text>
<circle cx="135" cy="260" r="35" class="light"/><circle cx="465" cy="260" r="35" class="light"/>
<text x="135" y="267" class="label" text-anchor="middle">R1</text><text x="465" y="267" class="label" text-anchor="middle">R2</text>
<line x1="170" y1="260" x2="258" y2="260" class="thin"/><line x1="342" y1="260" x2="430" y2="260" class="thin"/>
<text x="300" y="330" class="small" text-anchor="middle">same homing event; random plots ~75 m away; surveyed within ≤72 h</text>
<text x="300" y="390" class="label" text-anchor="middle">10 birds  •  190 valid matched events</text>

<text x="620" y="110" class="panel" text-anchor="start">B</text><text x="660" y="110" class="panel" text-anchor="start">Question shifts from selection to experienced trajectory</text>
<rect x="650" y="175" width="430" height="105" rx="12" class="light"/>
<text x="865" y="215" class="label" text-anchor="middle">Static habitat selection</text>
<text x="865" y="248" class="small" text-anchor="middle">used state vs available state at one time</text>
<line x1="865" y1="300" x2="865" y2="365" class="axis"/><polygon points="865,365 855,358 855,372" fill="#222"/>
<rect x="650" y="385" width="430" height="145" rx="12" class="light"/>
<text x="865" y="425" class="label" text-anchor="middle">Temporal environmental buffering</text>
<text x="865" y="457" class="small" text-anchor="middle">used-state trajectory through time</text>
<text x="865" y="485" class="small" text-anchor="middle">vs time-matched available pseudo-trajectories</text>
<text x="865" y="515" class="small" text-anchor="middle">biological replicate = individual bird</text>
<text x="50" y="675" class="small" text-anchor="start">Boundary: coordinate-to-event linkage is unresolved; the figure does not claim that measured geographic displacement caused buffering.</text>
</svg>