<text x="40" y="918" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6A7B83">Protected is a management class; Rice is a crop land-cover class. Used endpoints are not observed roost/foraging acts.</text>
<text x="40" y="940" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6A7B83">Explicit post-result exploratory follow-up, one public California study. Correlated landscape access and circadian activity are unresolved.</text>
